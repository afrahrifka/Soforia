name: "PR Title Validator"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            deps
            security
            remove
            comments
            error
            ux
            config
            files
            merge
            revert
            init

          scopes: |
            server
            controller
            console
            games
            orbit
            kebun
            seirama
            network
            ui
            accessibility
            offline
            tests
            docs
            build
            config
            collaboration
          requireScope: false
